# ═══════════════════════════════════════════════════════════════
# BRACE — Secret TEMPLATE
#
#   *** DO NOT COMMIT A FILLED-IN COPY OF THIS FILE ***
#
# This template holds placeholders only. Produce a real manifest with:
#
#     ./k8s/gen-secret.sh > /tmp/brace-secret.yaml     # generates strong values
#     oc apply -f /tmp/brace-secret.yaml
#     shred -u /tmp/brace-secret.yaml
#
# ...or create it imperatively so nothing ever lands on disk:
#
#     oc create secret generic brace-secret \
#       -n brace \
#       --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#       --from-literal=BRACE_ENCRYPT_KEY="$(python3 -c 'from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())')" \
#       --from-literal=BRACE_ADMIN_PASSWORD='<choose-a-strong-password>' \
#
# The Deployment mounts JWT_SECRET and BRACE_ENCRYPT_KEY as required keys — if
# this Secret is missing the pod will not start, which is deliberate: it fails
# closed rather than falling back to insecure defaults.
# ═══════════════════════════════════════════════════════════════

apiVersion: v1
kind: Secret
metadata:
  name: brace-secret
  namespace: brace
  labels:
    app: brace-rf-controller
type: Opaque
stringData:

  # ── Signs and verifies login tokens ──────────────────────────
  # Anyone who knows this value can forge a session as any user,
  # including admin. Use 32+ random bytes:  openssl rand -hex 32
  # Rotating it invalidates every existing session (users re-login).
  JWT_SECRET: "REPLACE_ME__openssl_rand_hex_32"

  # ── Encrypts git tokens and the AI API key at rest ───────────
  # MUST be a url-safe base64-encoded 32-byte Fernet key, e.g.
  #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  # A malformed value is logged as an error and secrets fall back to
  # PLAIN TEXT storage. Rotating it makes previously stored git tokens
  # undecryptable — re-enter them in each project's Settings afterwards.
  BRACE_ENCRYPT_KEY: "REPLACE_ME__fernet_generate_key"

  # ── Password for the bootstrap 'admin' account ───────────────
  # Only applied when the database is first created. Omit this key and
  # the account is seeded as admin/admin with a forced password change.
  BRACE_ADMIN_PASSWORD: "REPLACE_ME__strong_admin_password"

