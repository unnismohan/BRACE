# ═══════════════════════════════════════════════════════════════
# BRACE — Controller storage manifests
# Apply once: oc apply -f k8s/supporting.yaml
# Namespace: brace (existing)
# ═══════════════════════════════════════════════════════════════

# ── PVC: RF Suites ───────────────────────────────────────────
# Stores Robot Framework .robot files + test data
# Only the controller mounts this volume; runner receives frozen source archives.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brace-rf-suites-pvc
  namespace: brace
spec:
  # Use the cluster default StorageClass, or set a compatible class explicitly.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# ── PVC: RF Results ──────────────────────────────────────────
# Controller stores artifacts downloaded from remote workers here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brace-rf-results-pvc
  namespace: brace
spec:
  # Use the cluster default StorageClass, or set a compatible class explicitly.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
# ── PVC: RF Config (SQLite DB) ───────────────────────────────
# Stores brace.db — users, projects, schedules (RWO is fine, one pod)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: brace-rf-config-pvc
  namespace: brace
spec:
  # Use the cluster default StorageClass, or set a compatible class explicitly.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
