# ═══════════════════════════════════════════════════════════════
# BRACE RF Controller — Deployment + internal Service (remote execution)
# Apply: oc apply -f k8s/deployment.yaml
# ═══════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: brace-rf-controller
  namespace: brace
  labels:
    app: brace-rf-controller
spec:
  replicas: 1
  # Recreate, NOT the default RollingUpdate. With replicas:1 a rolling update
  # rounds maxSurge up to 1, so a new pod starts while the old one is still
  # serving. That breaks BRACE three ways:
  #   * brace-rf-config-pvc is ReadWriteOnce — on a different node the new pod
  #     cannot attach it and the rollout deadlocks;
  #   * on the same node both pods open the same SQLite file, and the new pod's
  #     startup reconciliation cancels the OLD pod's still-executing runs;
  #   * both pods run APScheduler, so every schedule fires twice.
  # Recreate costs a few seconds of downtime and avoids all three.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: brace-rf-controller
  template:
    metadata:
      labels:
        app: brace-rf-controller
      annotations:
        # Prometheus scrapes /metrics — queue depth, run outcomes and, most
        # usefully, brace_results_disk_bytes for an alert before the PVC fills.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      # Optional. Only needed when the applications under test are not
      # resolvable by cluster DNS. Test-target aliases belong on runner pods;
      # controller aliases are only needed for controller-side Git/SMTP access.
      # Delete this block entirely if your DNS already resolves them.
      # hostAliases:
      #   - ip: "10.0.0.10"
      #     hostnames:
      #       - app-under-test.example.local
      #   - ip: "10.0.0.11"
      #     hostnames:
      #       - gitlab.example.com

      containers:
        - name: rf-controller
          image: registry.example.com/brace/brace-runner-hardened:2.2.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http

          env:
            - name: BRACE_RUNNER_MODE
              value: remote
            - name: BRACE_REQUIRE_ISOLATION
              value: "true"
            - name: BRACE_RUNNER_ENDPOINTS
              valueFrom:
                secretKeyRef:
                  name: brace-runner-endpoints
                  key: endpoints
            - name: HOME
              value: /tmp
            - name: SUITES_DIR
              value: /opt/rf/suites
            - name: RESULTS_DIR
              value: /opt/rf/results
            - name: BSS_ENV
              value: production
            # Surfaced by /health and the startup log — keep in step with the
            # image tag above so you can confirm which build is actually live.
            - name: IMAGE_TAG
              value: "2.2.1"
            - name: CONFIG_DIR
              value: /opt/rf/config
            # ── Execution capacity ──────────────────────────────────────
            # Max runs admitted at once. Runs beyond this queue.
            - name: BRACE_MAX_CONCURRENT_RUNS
              value: "3"
            # Global Robot job budget across all project runners.
            # Size worker resources and BRACE_RUNNER_CAPACITY accordingly.
            - name: BRACE_MAX_CONCURRENT_TESTS
              value: "3"
            # Cases one run may execute at once, capped by the budget above.
            # Left equal to it, a lone run uses the whole budget instead of
            # trickling through one case at a time. Testers can override per run.
            - name: BRACE_RUN_PARALLEL
              value: "3"
            # Kill a single test case after this long so a wedged browser
            # cannot hold an execution slot and stall the queue.
            - name: BRACE_TEST_TIMEOUT_SEC
              value: "1800"
            # json emits one object per line with run_id/project_id/user fields
            # so a log stack can index and correlate them. Use "text" for humans.
            - name: BRACE_LOG_FORMAT
              value: "json"
            # ── Housekeeping ────────────────────────────────────────────
            # Delete runs finished more than this many days ago, with their
            # reports and logs. 0 = keep forever, which is the built-in default:
            # the value below is a deliberate choice, not an accident of upgrade.
            # The database grows by (runs x test cases) and each case also leaves
            # a log.html and report.html on the results volume, so on a nightly
            # 1000-case suite this is what stops the volume filling silently.
            - name: BRACE_RETENTION_DAYS
              value: "90"
            # Floor: never purge below this many runs per project, however old.
            # A project that runs monthly keeps its history regardless.
            - name: BRACE_RETENTION_KEEP_MIN
              value: "20"
            # Audit rows are tiny; keep them far longer than run data.
            - name: BRACE_AUDIT_RETENTION_DAYS
              value: "365"
            # When the nightly purge, orphan sweep and database compaction run.
            # Read in BRACE_SCHEDULER_TZ. Pick a quiet hour — VACUUM is skipped
            # automatically while anything is executing, but the file walk is
            # still I/O on the results volume.
            - name: BRACE_MAINT_CRON
              value: "30 2 * * *"
            # Live run updates are pushed over SSE instead of polled. This caps
            # concurrent watchers per run; past it a browser falls back to
            # polling, which still works.
            - name: BRACE_SSE_MAX_SUBS
              value: "20"
            # How long a results-volume size measurement is reused. Measuring
            # means walking the whole tree — seconds on a large volume — so
            # /metrics and the Housekeeping card share one sample instead of
            # each triggering a walk on every request.
            - name: BRACE_DISK_CACHE_TTL
              value: "300"
            # The container's own clock. Timestamps are written using local time
            # and the UI shows them as stored, so an unset TZ means the container
            # runs in UTC and every time in the UI reads 5h30m behind for an IST
            # viewer. Keep this equal to BRACE_SCHEDULER_TZ below.
            - name: TZ
              value: "Asia/Kolkata"
            # Cron expressions are read in this zone. Left as UTC it means
            # "0 2 * * *" fires at 07:30 IST, which surprises people.
            - name: BRACE_SCHEDULER_TZ
              value: "Asia/Kolkata"
            # The pod cannot know the URL users browse to, so without this the
            # notification emails have no working "open the run" link.
            # Must be the external Route, not the Service.
            - name: BRACE_PUBLIC_URL
              value: "https://brace-rf-dashboard-brace.apps.example.local"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: brace-secret
                  key: JWT_SECRET
            - name: BRACE_ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: brace-secret
                  key: BRACE_ENCRYPT_KEY
            # Seeds the bootstrap 'admin' password on a fresh database.
            # Required in this production example; never seed admin/admin.
            - name: BRACE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brace-secret
                  key: BRACE_ADMIN_PASSWORD
          # Controller still parses reports and handles artifact archives.
          # Browser resources belong to the separate runner Deployment.
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

          # Startup does schema migrations, orphan reconciliation and schedule
          # loading against a PVC. Without a startupProbe the liveness probe's
          # own budget (15s + 3x30s) applies, and a slow volume would get the
          # pod killed and restarted in a loop that looks like a crash.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30     # up to 150s to come up

          # Liveness restarts the pod, which kills every run in flight — so it
          # must only fire when the process is genuinely wedged. /health does no
          # I/O at all, and the thresholds are deliberately slack: under a wide
          # parallel run the default 1s timeout is not enough for the threadpool
          # to answer, and a single slow reply must not cost a restart.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6      # ~3 min of continuous failure before restart

          # Readiness only removes the pod from the Service, so this one may
          # check the database. /health/ready returns 503 rather than raising.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4

          volumeMounts:
            - name: rf-suites
              mountPath: /opt/rf/suites
            - name: rf-results
              mountPath: /opt/rf/results
            - name: rf-config
              mountPath: /opt/rf/config
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: rf-suites
          persistentVolumeClaim:
            claimName: brace-rf-suites-pvc
        - name: rf-results
          persistentVolumeClaim:
            claimName: brace-rf-results-pvc
        - name: rf-config
          persistentVolumeClaim:
            claimName: brace-rf-config-pvc
        - name: dshm
          emptyDir:
            medium: Memory
            # Controller entrypoint still starts Xvfb; browser work is remote.
            sizeLimit: 64Mi
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: brace-rf-controller
  namespace: brace
spec:
  selector:
    app: brace-rf-controller
  ports:
    - port: 8080
      targetPort: 8080
      name: http
